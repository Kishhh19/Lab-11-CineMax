<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax - Movie Search Engine</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; margin: 0; padding: 0; color: #fff; }
        .page { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .hero { text-align: center; padding: 60px 20px; background: rgba(255, 255, 255, 0.05); border-radius: 20px; margin-bottom: 40px; border: 1px solid #333; }
        .hero h1 { font-size: 3rem; margin: 0; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .hero p { font-size: 1.2rem; color: #ccc; margin: 10px 0 30px; }
        .search-form { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .search-form input { flex: 1; max-width: 500px; padding: 15px 20px; border-radius: 50px; border: 1px solid #555; background: #222; color: #fff; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .search-form input::placeholder { color: #aaa; }
        .search-form button { padding: 15px 30px; border-radius: 50px; border: none; background: #fff; color: #000; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: background 0.3s; }
        .search-form button:hover { background: #ddd; }
        .status { margin: 20px 0; padding: 15px; border-radius: 10px; text-align: center; }
        .status.success { background: rgba(0, 255, 0, 0.1); color: #0f0; border: 1px solid #0f0; }
        .status.error { background: rgba(255, 0, 0, 0.1); color: #f00; border: 1px solid #f00; }
        .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
        .movie-card { background: #111; border-radius: 15px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.5); transition: transform 0.3s, box-shadow 0.3s; border: 1px solid #333; }
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 12px 35px rgba(0,0,0,0.7); }
        .movie-card img { width: 100%; height: 200px; object-fit: cover; }
        .movie-details { padding: 20px; }
        .movie-details h3 { margin: 0 0 10px; font-size: 1.3rem; color: #fff; }
        .movie-details p { margin: 10px 0; color: #ccc; line-height: 1.5; }
        .movie-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .tag { background: #333; border-radius: 20px; padding: 5px 12px; font-size: 0.9rem; color: #fff; border: 1px solid #555; }
        .tag.score { background: #444; color: #ffd700; border: 1px solid #ffd700; }
        .loading { text-align: center; padding: 40px; color: #ccc; }
        @media (max-width: 768px) { .hero h1 { font-size: 2rem; } .results { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="page">
    <div class="hero">
        <h1>CineMax</h1>
        <p>Discover your next favorite movie with our powerful search engine.</p>
        <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" placeholder="Search for movies..." value="">
            <button type="submit">Search</button>
        </form>
        <div id="status"></div>
    </div>

    <div id="results" class="results">
        <div class="loading">Loading movies...</div>
    </div>
</div>

<script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');
    const statusContainer = document.getElementById('status');

    // Initialize on page load
    window.addEventListener('load', () => {
        const params = new URLSearchParams(window.location.search);
        const urlQuery = params.get('query') || '';
        searchInput.value = urlQuery;
        loadMovies(urlQuery);
    });

    // Handle form submission
    searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const query = searchInput.value.trim();
        loadMovies(query);
        if (query) {
            window.history.pushState({}, '', `?query=${encodeURIComponent(query)}`);
        }
    });

    async function loadMovies(query) {
        statusContainer.innerHTML = '';
        resultsContainer.innerHTML = '<div class="loading">Loading movies...</div>';

        try {
            // Fetch from index.php with the query parameter
            const url = `./index.php?query=${encodeURIComponent(query)}`;
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const html = await response.text();

            // Extract movie data from the response
            const movieCards = extractMovieCards(html);

            if (movieCards.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="movie-card">
                        <div class="movie-details">
                            <h3>No movies found</h3>
                            <p>Try adjusting your search query.</p>
                        </div>
                    </div>
                `;
                return;
            }

            // Show search status if applicable
            if (query) {
                statusContainer.innerHTML = `
                    <div class="status success">
                        Showing results for: <strong>${escapeHtml(query)}</strong>
                    </div>
                `;
            }

            // Render movies
            resultsContainer.innerHTML = '';
            movieCards.forEach(movie => {
                resultsContainer.innerHTML += renderMovieCard(movie);
            });

        } catch (error) {
            console.error('Error:', error);
            resultsContainer.innerHTML = `
                <div class="movie-card">
                    <div class="movie-details">
                        <h3>Error Loading Movies</h3>
                        <p>${escapeHtml(error.message)}</p>
                        <p style="font-size: 0.9rem; color: #999; margin-top: 10px;">Make sure index.php is accessible at ./index.php</p>
                    </div>
                </div>
            `;
        }
    }

    function extractMovieCards(html) {
        const cards = [];
        const cardPattern = /<div class="movie-card">(.*?)<\/div>\s*<\/div>\s*<\/div>/gs;
        const matches = html.matchAll(cardPattern);

        for (const match of matches) {
            const cardHtml = match[1];
            
            // Extract image
            const imgMatch = cardHtml.match(/<img[^>]*src="([^"]*)"[^>]*>/);
            const posterUrl = imgMatch ? imgMatch[1] : '';

            // Extract title
            const titleMatch = cardHtml.match(/<h3>([^<]*)<\/h3>/);
            const title = titleMatch ? htmlDecode(titleMatch[1]) : 'Untitled';

            // Extract all tags
            const tagMatches = [...cardHtml.matchAll(/<span class="tag[^"]*">([^<]*)<\/span>/g)];
            let releaseDate = '';
            let score = '';
            let language = '';
            let genre = '';

            tagMatches.forEach((tag, index) => {
                const content = htmlDecode(tag[1]);
                if (index === 0) releaseDate = content;
                else if (index === 1) score = content;
                else if (index === 2) language = content;
                else if (index === 3) genre = content;
            });

            // Extract overview
            const pMatch = cardHtml.match(/<div class="movie-details">([\s\S]*?)<p>([^<]*)<\/p>/);
            const overview = pMatch ? htmlDecode(pMatch[2]) : '';

            cards.push({
                posterUrl,
                title,
                releaseDate,
                score,
                language,
                genre,
                overview
            });
        }

        return cards;
    }

    function renderMovieCard(movie) {
        return `
            <div class="movie-card">
                <img src="${escapeHtml(movie.posterUrl)}" alt="${escapeHtml(movie.title)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22%3E%3Crect fill=%22%23333%22 width=%22300%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dy=%22.3em%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2216%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                <div class="movie-details">
                    <h3>${escapeHtml(movie.title)}</h3>
                    <div class="movie-meta">
                        <span class="tag">${escapeHtml(movie.releaseDate)}</span>
                        <span class="tag score">${escapeHtml(movie.score)}</span>
                        <span class="tag">${escapeHtml(movie.language)}</span>
                    </div>
                    <div class="movie-meta">
                        <span class="tag">${escapeHtml(movie.genre)}</span>
                    </div>
                    <p>${escapeHtml(movie.overview)}</p>
                </div>
            </div>
        `;
    }

    function htmlDecode(html) {
        const div = document.createElement('div');
        div.innerHTML = html;
        return div.textContent || div.innerText || '';
    }

    function escapeHtml(text) {
        if (!text) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }
</script>
</body>
</html>
